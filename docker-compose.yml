

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./:/app                 # mount monorepo
      - /app/node_modules       # keep container node_modules intact
    command: ["pnpm", "--filter", "web", "dev"]
