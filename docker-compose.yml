

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./:/app                 # mount monorepo
      - /app/node_modules       # keep container node_modules intact
    command: ["pnpm", "--filter", "web", "dev"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    ports:
      - "3000:3000"
    volumes:
    - ./apps/api:/app/apps/api
    - /app/node_modules  # keep container node_modules intact
    command: ["pnpm", "--filter", "api", "dev"]

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
